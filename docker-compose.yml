version: "3.9"

services:
  fap-insurance:
    build:
      context: .
      dockerfile: Dockerfile
    image: fap-insurance:0.3.0-grand-slam
    container_name: fap-insurance
    ports:
      - "8000:8000"
    environment:
      - FAP_ENV=production
      - FAP_PORT=8000
      - FAP_LOG_LEVEL=INFO
      - FAP_LOG_JSON=true
      # Rotate this in production via secrets manager
      - FAP_API_KEY=prod-fap-key-REPLACE-ME-IN-SECRETS
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
