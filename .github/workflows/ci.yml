name: FAP-Insurance CI/CD

on:
  push:
    branches: [main, master, feature/dpie-assurance-gateway]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint assurance layer
        run: |
          ruff check --fix dpie_assurance.py dpie_context.py dpie_runtime.py dpie_composition.py governor.py tests/test_dpie_assurance.py tests/test_dpie_audit_boundary.py tests/test_dpie_composition.py tests/test_dpie_fap_boundary.py tests/test_dpie_red_team.py tests/test_dpie_smoke.py
          ruff check dpie_assurance.py dpie_context.py dpie_runtime.py dpie_composition.py governor.py tests/test_dpie_assurance.py tests/test_dpie_audit_boundary.py tests/test_dpie_composition.py tests/test_dpie_fap_boundary.py tests/test_dpie_red_team.py tests/test_dpie_smoke.py
      - name: Compile assurance layer
        run: python -m compileall -q dpie_assurance.py dpie_context.py dpie_runtime.py dpie_composition.py governor.py
      - name: Import API
        run: python -c "from api import app; print(app.title)"
      - name: API health
        run: pytest -q tests/test_api.py -k test_health --tb=short
      - name: API auth
        run: pytest -q tests/test_api.py -k 'verify_missing_key or verify_invalid_key' --tb=short
      - name: API claim validation
        run: pytest -q tests/test_api.py -k 'claim_id' --tb=short
      - name: API media validation
        run: pytest -q tests/test_api.py -k 'media_hash' --tb=short
      - name: API timestamp and witnesses
        run: pytest -q tests/test_api.py -k 'timestamp or witness' --tb=short
      - name: API verdict and demo
        run: pytest -q tests/test_api.py -k 'verdict_structure or demo or error_response' --tb=short
      - name: DPIE assurance tests
        run: pytest -q tests/test_dpie_assurance.py --tb=short
      - name: DPIE audit tests
        run: pytest -q tests/test_dpie_audit_boundary.py --tb=short
      - name: DPIE composition tests
        run: pytest -q tests/test_dpie_composition.py --tb=short
      - name: DPIE FAP boundary tests
        run: pytest -q tests/test_dpie_fap_boundary.py --tb=short
      - name: DPIE red-team tests
        run: pytest -q tests/test_dpie_red_team.py --tb=short
      - name: DPIE smoke test
        run: pytest -q tests/test_dpie_smoke.py --tb=short
      - name: Full test suite
        run: pytest -q --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build image
        run: docker build -t fap-insurance:${{ github.sha }} .
