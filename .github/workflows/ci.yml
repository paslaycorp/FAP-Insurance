name: FAP-Insurance CI/CD

on:
  push:
    branches: [main, master, feature/dpie-assurance-gateway, feature/epm-production-hardening]
  pull_request:
    branches: [main, master]

env:
  FAP_API_KEY: ci-test-key
  FAP_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint Python sources
        run: ruff check --select E4,E7,E9,F --ignore F401 .
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Import API
        run: python -c "from api import app; print(app.title)"
      - name: Run complete test suite
        run: pytest -q --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature/epm-production-hardening'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build image
        run: docker build --pull -t fap-insurance:${{ github.sha }} .
      - name: Start container
        run: docker run -d --name fap-insurance -p 8000:8000 -e FAP_ENV=test -e FAP_API_KEY=ci-test-key fap-insurance:${{ github.sha }}
      - name: Container health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs fap-insurance
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f fap-insurance || true
