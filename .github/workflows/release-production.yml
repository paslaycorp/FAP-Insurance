name: Production Release

on:
  workflow_run:
    workflows: ["FAP-Insurance CI/CD"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact main-branch commit SHA to release; blank means current main"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: fap-insurance-production
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fap-core.onrender.com
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-d9fp2l3bc2fs73blamug
      PRODUCTION_HEALTH_URL: https://fap-core.onrender.com/health

    steps:
      - name: Resolve exact release SHA
        id: target
        env:
          DISPATCH_SHA: ${{ inputs.sha }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            sha="${WORKFLOW_SHA}"
          elif [[ -n "${DISPATCH_SHA:-}" ]]; then
            sha="${DISPATCH_SHA}"
          else
            sha="${GITHUB_SHA}"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: $sha" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Reject superseded candidate
        id: freshness
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          current="$(git rev-parse origin/main)"
          target="${{ steps.target.outputs.sha }}"
          if [[ "$current" != "$target" ]]; then
            echo "Candidate $target is superseded by current main $current; no deployment will occur."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record superseded release
        if: steps.freshness.outputs.eligible != 'true'
        run: |
          {
            echo "## Production release"
            echo
            echo "Candidate was superseded before deployment. No production mutation occurred."
            echo
            echo "- Candidate: \`${{ steps.target.outputs.sha }}\`"
            echo "- Current main: \`$(git rev-parse origin/main)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prove CI on manual dispatch
        if: steps.freshness.outputs.eligible == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          count="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&status=success&per_page=20" \
            --jq '.total_count')"
          if [[ "$count" -lt 1 ]]; then
            echo "No successful FAP-Insurance CI/CD run exists for $TARGET_SHA" >&2
            exit 1
          fi

      - name: Require production credential
        if: steps.freshness.outputs.eligible == 'true'
        run: |
          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo "RENDER_API_KEY is missing from the production GitHub environment." >&2
            echo "Release is fail-closed; nothing was deployed." >&2
            exit 1
          fi

      - name: Set up Python
        if: steps.freshness.outputs.eligible == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release dependency
        if: steps.freshness.outputs.eligible == 'true'
        run: pip install httpx==0.28.0

      - name: Re-run release-controller tests
        if: steps.freshness.outputs.eligible == 'true'
        run: |
          pip install pytest==8.3.0
          pytest -q tests/test_render_release.py --tb=short

      - name: Deploy exact SHA and prove runtime
        if: steps.freshness.outputs.eligible == 'true'
        env:
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
        run: python ops/render_release.py

      - name: Upload release attestation
        if: always() && steps.freshness.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-release-attestation-${{ steps.target.outputs.sha }}
          path: release-attestation.json
          if-no-files-found: warn
          retention-days: 90
