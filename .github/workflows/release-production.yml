name: Production Release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact merged main-branch commit SHA to release"
        required: true
        type: string
      fap_core_sha:
        description: "Exact already-live FAP-Core commit SHA required by this release"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: fap-insurance-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://fap-core.onrender.com
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      FAP_CORE_API_KEY: ${{ secrets.FAP_CORE_API_KEY }}
      RENDER_SERVICE_ID: srv-d9fp2l3bc2fs73blamug
      PRODUCTION_HEALTH_URL: https://fap-core.onrender.com/health
      FAP_CORE_IDENTITY_URL: https://fap-core-odm4.onrender.com/auth/check

    steps:
      - name: Resolve exact release SHA
        id: target
        env:
          DISPATCH_SHA: ${{ inputs.sha }}
          DISPATCH_FAP_CORE_SHA: ${{ inputs.fap_core_sha }}
        run: |
          set -euo pipefail
          sha="${DISPATCH_SHA:-}"
          fap_core_sha="${DISPATCH_FAP_CORE_SHA:-}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: $sha" >&2
            exit 1
          fi
          if [[ ! "$fap_core_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid FAP-Core SHA: $fap_core_sha" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "fap_core_sha=$fap_core_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Reject superseded candidate
        id: freshness
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          current="$(git rev-parse origin/main)"
          target="${{ steps.target.outputs.sha }}"
          if [[ "$current" != "$target" ]]; then
            echo "Candidate $target is superseded by current main $current; no deployment will occur."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record superseded release
        if: steps.freshness.outputs.eligible != 'true'
        run: |
          {
            echo "## Production release"
            echo
            echo "Candidate was superseded before deployment. No production mutation occurred."
            echo
            echo "- Candidate: `${{ steps.target.outputs.sha }}`"
            echo "- Current main: `$(git rev-parse origin/main)`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require merge-commit topology
        if: steps.freshness.outputs.eligible == 'true'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          read -r -a parts <<< "$(git rev-list --parents -n 1 "$TARGET_SHA")"
          if [[ "${#parts[@]}" -ne 3 ]]; then
            echo "Release denied: $TARGET_SHA is not a two-parent merge commit." >&2
            exit 1
          fi

      - name: Require merged-PR provenance
        if: steps.freshness.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          PR_PAYLOAD="$(gh api -H "Accept: application/vnd.github+json" "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/pulls")"
          export PR_PAYLOAD
          python - <<'PY'
          import json
          import os
          import sys

          sha = os.environ["TARGET_SHA"]
          prs = json.loads(os.environ["PR_PAYLOAD"])
          matches = [
              pr
              for pr in prs
              if pr.get("merged_at")
              and pr.get("base", {}).get("ref") == "main"
              and pr.get("merge_commit_sha") == sha
          ]
          if len(matches) != 1:
              print(
                  f"Release denied: {sha} is not uniquely attributable to a merged PR into main.",
                  file=sys.stderr,
              )
              sys.exit(1)

          pr = matches[0]
          number = pr.get("number")
          url = pr.get("html_url")
          print(f"Release provenance accepted: PR #{number} -> {sha}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## Merge provenance\n\n")
                  handle.write(f"- PR: [#{number}]({url})\n")
                  handle.write(f"- Merge SHA: `{sha}`\n")
          PY

      - name: Prove CI for exact candidate
        if: steps.freshness.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          count="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&status=success&per_page=20" \
            --jq '.total_count')"
          if [[ "$count" -lt 1 ]]; then
            echo "No successful FAP-Insurance CI/CD run exists for $TARGET_SHA" >&2
            exit 1
          fi

      - name: Require production credentials
        if: steps.freshness.outputs.eligible == 'true'
        run: |
          missing=0
          for name in RENDER_API_KEY FAP_CORE_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is missing from the protected GitHub production environment." >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Release is fail-closed; nothing was deployed." >&2
            exit 1
          fi

      - name: Set up Python
        if: steps.freshness.outputs.eligible == 'true'
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.14"

      - name: Install release dependency
        if: steps.freshness.outputs.eligible == 'true'
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install "httpx==0.28.0"

      - name: Re-run release-controller tests
        if: steps.freshness.outputs.eligible == 'true'
        run: |
          python -m pip install "pytest==8.3.0"
          pytest -q tests/test_render_release.py --tb=short

      - name: Deploy exact SHA and prove runtime
        if: steps.freshness.outputs.eligible == 'true'
        env:
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
          EXPECTED_FAP_CORE_SHA: ${{ steps.target.outputs.fap_core_sha }}
        run: python ops/render_release.py

      - name: Upload release attestation
        if: always() && steps.freshness.outputs.eligible == 'true'
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-release-attestation-${{ steps.target.outputs.sha }}
          path: release-attestation.json
          if-no-files-found: warn
          retention-days: 90
